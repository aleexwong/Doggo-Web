<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doggo — Guess the Breed</title>
    <meta
      name="description"
      content="A photo appears and you choose from four dog breeds. How many can you get right in a row? A free guessing game — no account needed."
    />
    <meta property="og:title" content="Doggo — Guess the Breed" />
    <meta
      property="og:description"
      content="A photo appears and you choose from four dog breeds. How many can you get right in a row?"
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0f1011" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the stored/system theme before first paint so the app never
      // flashes the wrong one. This has to run before the bundle, so it can't
      // import anything — instead __DOGGO_APPEARANCE__ is replaced at build
      // time with the values from src/game/appearance.ts (see the plugin in
      // vite.config.ts). Nothing here is a second copy of a constant.
      try {
        var cfg = __DOGGO_APPEARANCE__
        var t = localStorage.getItem(cfg.key)
        var asked = (location.search.match(/[?&]frame=([a-z]+)/i) || [, ''])[1].toLowerCase()
        // An empty ?frame= means DEFAULT_FRAME; otherwise ask the alias table.
        var wantsDark = asked === '' ? cfg.defaultDark : cfg.darkFrames.indexOf(asked) >= 0
        if (t !== 'light' && t !== 'dark')
          t = wantsDark || matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name="theme-color"]').content = cfg.surface[t]
      } catch (e) {
        /* storage or matchMedia blocked - CSS media query still applies */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
